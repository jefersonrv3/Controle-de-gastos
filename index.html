<!DOCTYPE html>
<!-- 
  ESQUELETO BASE - Controle de Gastos
  Este arquivo só define a ESTRUTURA (semântica) da página.
  Nenhum estilo visual aqui (isso fica no style.css) e nenhuma lógica (isso fica nos .js).
  Comentários explicam o "porquê" de cada escolha, pra você reutilizar na explicação com recrutador.
-->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- viewport é essencial pra responsividade: sem isso, o mobile renderiza como se fosse desktop e depois "encolhe" -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>

    <!-- Fontes usadas nas variáveis --font-display / --font-body / --font-mono do style.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
        rel="stylesheet">

    <!-- CSS fica em arquivo separado (separação de responsabilidades: estrutura x aparência) -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 
    HEADER: identidade do app + visão geral rápida (ex: saldo total somando todas as contas).
    É a primeira coisa que o usuário vê, então fica fora do <main> por semântica 
    (não é "conteúdo principal", é cabeçalho/contexto).
  -->
    <header>
        <h1>Controle de Gastos</h1>
        <!-- Espaço reservado pro saldo total geral, que o JS vai calcular somando todas as contas -->
        <p id="saldo-total">Saldo total: R$ 0,00</p>
    </header>

    <!-- 
    MAIN: conteúdo principal da página. Só existe UM <main> por página (regra de acessibilidade).
    Dentro dele, cada funcionalidade grande vira uma <section> própria.
  -->
    <main>

        <!-- ======================================================
         SEÇÃO 1: CONTAS (carteiras / saldos)
         ====================================================== -->
        <section id="contas" aria-labelledby="titulo-contas">
            <h2 id="titulo-contas">Minhas Contas</h2>

            <!-- Botão que vai abrir um formulário/modal de nova conta (comportamento fica no JS) -->
            <button type="button" id="btn-nova-conta">+ Adicionar Conta</button>

            <!-- 
        Container vazio onde o JS vai INJETAR os cards de conta dinamicamente.
        Cada conta salva no localStorage vira um card aqui.
        data-container ajuda a identificar esse elemento no JS sem depender de classes de estilo.
      -->
            <div id="lista-contas" data-container="contas">
                <!-- Exemplo do que um card gerado por JS vai parecer (deixado como comentário/referência):
        <div class="card-conta" data-conta-id="1">
          <h3>Nome da Conta</h3>
          <p>R$ 1.000,00</p>
        </div>
        -->
            </div>

            <!-- 
        <dialog> é um elemento NATIVO do HTML5 pra modais: já vem com
        fundo escurecido (::backdrop), abre com .showModal() e fecha com .close()
        via JS, sem precisar de biblioteca externa nem CSS de posicionamento manual.
      -->
            <dialog id="dialog-nova-conta">
                <form id="form-nova-conta">
                    <h3>Nova Conta</h3>

                    <label for="conta-nome">Nome da conta</label>
                    <input type="text" id="conta-nome" name="nome" placeholder="Ex: Carteira, Nubank..." required>

                    <label for="conta-saldo">Saldo inicial (R$)</label>
                    <input type="number" id="conta-saldo" name="saldo" step="0.01" placeholder="0,00" required>

                    <div class="dialog-acoes">
                        <!-- type="button" com id específico pro JS fechar sem submeter o form -->
                        <button type="button" id="btn-cancelar-conta">Cancelar</button>
                        <button type="submit">Salvar</button>
                    </div>
                </form>
            </dialog>
        </section>

        <!-- ======================================================
         SEÇÃO 2: LANÇAMENTOS (gastos diários)
         Dois cards lado a lado: formulário de novo lançamento + histórico
         ====================================================== -->
        <section id="lancamentos" aria-labelledby="titulo-lancamentos">
            <h2 id="titulo-lancamentos">Lançamentos</h2>

            <!-- Card 1: formulário de novo lançamento -->
            <div class="card" id="card-novo-lancamento">
                <h3>Novo Lançamento</h3>

                <!-- 
          <form> de verdade (não uma div qualquer): isso dá validação nativa do navegador
          de graça com o atributo "required", sem precisar escrever JS pra validar campo vazio.
        -->
                <form id="form-lancamento">

                    <!-- Select vai ser preenchido via JS com as contas cadastradas (não dá pra saber antecipadamente) -->
                    <label for="lancamento-conta">Conta</label>
                    <select id="lancamento-conta" name="conta" required>
                        <!-- <option> gerado dinamicamente pelo JS a partir da lista de contas -->
                    </select>

                    <label for="lancamento-descricao">Descrição</label>
                    <input type="text" id="lancamento-descricao" name="descricao" placeholder="Ex: Mercado" required>

                    <label for="lancamento-valor">Valor (R$)</label>
                    <!-- type="number" com step ajuda a evitar entrada de texto inválido, e já abre teclado numérico no celular -->
                    <input type="number" id="lancamento-valor" name="valor" step="0.01" min="0" placeholder="0,00"
                        required>

                    <!-- 
            Repare: NÃO existe campo de data aqui.
            Por especificação do projeto, a data é capturada automaticamente pelo JS 
            no momento do submit (new Date()), então não faz sentido o usuário digitar.
          -->

                    <button type="submit">Adicionar Lançamento</button>
                </form>
            </div>

            <!-- Card 2: histórico de lançamentos -->
            <div class="card" id="card-historico">
                <h3>Histórico</h3>

                <!-- Container onde o JS vai listar cada lançamento salvo (mais recente primeiro, por exemplo) -->
                <ul id="lista-historico" data-container="historico">
                    <!-- Exemplo de item gerado por JS:
          <li class="item-historico" data-lancamento-id="1">
            <span>Mercado</span>
            <span>R$ 150,00</span>
            <span>24/08/2026</span>
          </li>
          -->
                </ul>
            </div>
        </section>

        <!-- ======================================================
         SEÇÃO 3: DÍVIDAS ATIVAS (compras parceladas, empréstimos etc.)
         ====================================================== -->
        <section id="dividas" aria-labelledby="titulo-dividas">
            <h2 id="titulo-dividas">Dívidas Ativas</h2>

            <button type="button" id="btn-nova-divida">+ Nova Dívida</button>

            <!-- 
        Container onde o JS vai montar um card POR dívida.
        Cada card mostra: descrição, parcelas restantes, valor da parcela,
        previsão de pagamento e um indicador visual (classe CSS) de alerta de vencimento.
      -->
            <div id="lista-dividas" data-container="dividas">
                <!-- Exemplo de card gerado por JS:
        <div class="card-divida" data-divida-id="1">
          <h3>Notebook</h3>
          <p>Parcela 3 de 10</p>
          <p>Próximo vencimento: 05/09/2026</p>
          <!-- classe "alerta-vencimento" adicionada via JS quando a data estiver próxima -->
                <!-- <span class="badge alerta-vencimento">Vence em 3 dias</span> -->
            </div>
            -->
            </div>

            <dialog id="dialog-nova-divida">
                <form id="form-nova-divida">
                    <h3>Nova Dívida</h3>

                    <label for="divida-descricao">Descrição</label>
                    <input type="text" id="divida-descricao" name="descricao" placeholder="Ex: Notebook parcelado"
                        required>

                    <label for="divida-valor-total">Valor total (R$)</label>
                    <input type="number" id="divida-valor-total" name="valorTotal" step="0.01" min="0" required>

                    <label for="divida-parcelas">Número de parcelas</label>
                    <input type="number" id="divida-parcelas" name="numParcelas" step="1" min="1" required>

                    <label for="divida-primeiro-vencimento">Data do primeiro vencimento</label>
                    <!-- 
            Aqui SIM faz sentido pedir a data pro usuário digitar (diferente do
            lançamento diário): o primeiro vencimento de uma dívida geralmente
            não é "hoje", é uma data futura definida no ato da compra.
          -->
                    <input type="date" id="divida-primeiro-vencimento" name="primeiroVencimento" required>

                    <div class="dialog-acoes">
                        <button type="button" id="btn-cancelar-divida">Cancelar</button>
                        <button type="submit">Salvar</button>
                    </div>
                </form>
            </dialog>
        </section>

    </main>

    <footer>
        <p>Projeto de portfólio — dados salvos localmente no navegador (localStorage)</p>
    </footer>

    <!-- 
    Scripts no final do <body>: assim o HTML já foi todo carregado (DOM pronto)
    antes do JS tentar manipular elementos, sem precisar de DOMContentLoaded em todo arquivo.
    A ordem importa: storage e models não dependem de nada, ui depende dos models,
    e app.js é o último porque orquestra tudo que veio antes.
  -->
    <script src="js/storage.js"></script>
    <script src="js/models.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
